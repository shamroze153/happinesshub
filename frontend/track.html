<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Track Order — Happiness Hub</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    .track-page { max-width: 680px; margin: 60px auto; padding: 0 20px; }
    .order-card { margin-top: 24px; animation: slideUp 0.4s ease; }

    .progress-bar-wrap {
      display: flex;
      justify-content: space-between;
      position: relative;
      margin: 24px 0;
    }
    .progress-bar-wrap::before {
      content: '';
      position: absolute;
      top: 16px;
      left: 12%;
      right: 12%;
      height: 2px;
      background: var(--border);
      z-index: 0;
    }
    .progress-step {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 8px;
      z-index: 1;
      flex: 1;
    }
    .progress-dot {
      width: 32px; height: 32px;
      border-radius: 50%;
      border: 2px solid var(--border);
      background: var(--bg);
      display: flex; align-items: center; justify-content: center;
      font-size: 14px;
      transition: all 0.3s;
    }
    .progress-dot.done    { background: var(--accent-green); border-color: var(--accent-green); }
    .progress-dot.active  { background: var(--primary); border-color: var(--primary); box-shadow: 0 0 12px rgba(108,99,255,0.4); }
    .progress-dot.error   { background: var(--accent); border-color: var(--accent); }
    .progress-label {
      font-size: 11px;
      color: var(--text-muted);
      text-align: center;
      line-height: 1.3;
    }
    .progress-label.active { color: var(--primary-light); font-weight: 600; }

    .order-detail-row {
      display: flex;
      justify-content: space-between;
      padding: 12px 0;
      border-bottom: 1px solid var(--border);
      font-size: 14px;
    }
    .order-detail-row:last-child { border-bottom: none; }
    .order-detail-label { color: var(--text-muted); }
    .order-detail-value { color: var(--text-primary); font-weight: 500; }
  </style>
</head>
<body>

<nav class="navbar">
  <div class="navbar-inner">
    <a href="index.html" class="navbar-logo">
      <div class="logo-icon">😊</div>
      Happiness<span>Hub</span>
    </a>
    <div class="navbar-links">
      <a href="index.html">Deals</a>
      <a href="track.html" class="active">Track Order</a>
    </div>
  </div>
</nav>

<div class="track-page">
  <div style="text-align:center;margin-bottom:40px;">
    <h1 style="margin-bottom:12px;">📦 Track Your Order</h1>
    <p>Enter your WhatsApp number or Order ID to check your cashback status.</p>
  </div>

  <!-- Search Form -->
  <div class="card">
    <div style="display:flex;gap:12px;flex-wrap:wrap;">
      <div style="flex:1;min-width:200px;">
        <select id="trackMethod" class="form-control" onchange="updatePlaceholder()">
          <option value="whatsapp">📱 WhatsApp Number</option>
          <option value="order_id">🔢 Order ID</option>
        </select>
      </div>
      <div style="flex:2;min-width:220px;">
        <input type="text" id="trackInput" class="form-control" placeholder="Enter your WhatsApp number" autocomplete="off">
      </div>
      <button onclick="trackOrder()" class="btn-primary" id="trackBtn">
        🔍 Track
      </button>
    </div>
  </div>

  <!-- Results -->
  <div id="trackResults"></div>
</div>

<footer class="footer" style="margin-top:80px;">
  <div class="container">
    <p>© <span id="year"></span> Happiness Hub</p>
  </div>
</footer>

<script src="lib/hh.js"></script>
<script>
  document.getElementById("year").textContent = new Date().getFullYear();

  // Auto-fill from URL params
  const urlParams = new URLSearchParams(window.location.search);
  const preFill = urlParams.get("order_id") || urlParams.get("whatsapp");
  if (preFill) {
    document.getElementById("trackInput").value = preFill;
    if (urlParams.get("order_id")) {
      document.getElementById("trackMethod").value = "order_id";
      updatePlaceholder();
    }
    trackOrder();
  }

  document.getElementById("trackInput").addEventListener("keydown", e => {
    if (e.key === "Enter") trackOrder();
  });

  function updatePlaceholder() {
    const method = document.getElementById("trackMethod").value;
    document.getElementById("trackInput").placeholder =
      method === "whatsapp" ? "Enter your WhatsApp number" : "Enter Order ID or Amazon Order ID";
  }

  async function trackOrder() {
    const method = document.getElementById("trackMethod").value;
    const value = document.getElementById("trackInput").value.trim();
    const btn = document.getElementById("trackBtn");
    const container = document.getElementById("trackResults");

    if (!value) { HH.toast("Please enter a value to search", "error"); return; }

    btn.disabled = true;
    btn.textContent = "Searching...";
    container.innerHTML = `
      <div style="display:flex;align-items:center;justify-content:center;padding:40px;gap:12px;">
        <div class="spinner"></div>
        <span style="color:var(--text-secondary);">Searching orders...</span>
      </div>`;

    const params = method === "whatsapp" ? { whatsapp: value } : { order_id: value };
    const res = await HH.get("trackOrder", params);

    btn.disabled = false;
    btn.textContent = "🔍 Track";

    if (!res.success) {
      container.innerHTML = `
        <div class="card mt-16 text-center" style="padding:40px;">
          <div style="font-size:48px;margin-bottom:16px;">🔎</div>
          <h3>No orders found</h3>
          <p>${HH.escapeHtml(res.error || "No orders match your search.")}</p>
          <p style="margin-top:12px;font-size:13px;">Double-check your number or order ID, or <a href="index.html">browse deals</a>.</p>
        </div>`;
      return;
    }

    const orders = res.orders;
    container.innerHTML = `
      <div style="margin-top:8px;">
        <h3 style="margin-bottom:16px;color:var(--text-secondary);font-size:14px;">
          Found ${orders.length} order${orders.length !== 1 ? "s" : ""}
        </h3>
        ${orders.map(renderOrderCard).join("")}
      </div>`;
  }

  const STATUS_STEPS = [
    { key: "Pending",       icon: "⏳", label: "Submitted" },
    { key: "Ordered",       icon: "🛒", label: "Ordered" },
    { key: "Delivered",     icon: "📦", label: "Delivered" },
    { key: "Cashback Sent", icon: "💸", label: "Cashback\nSent" },
  ];
  const ERROR_STATUSES = ["Rejected", "Need More Info", "PayPal Issue"];

  function getStepIndex(status) {
    const idx = STATUS_STEPS.findIndex(s => s.key === status);
    return idx;
  }

  function renderOrderCard(order) {
    const stepIdx = getStepIndex(order.status);
    const isError = ERROR_STATUSES.includes(order.status);

    const progressSteps = STATUS_STEPS.map((step, i) => {
      let dotClass = "";
      if (isError && i === stepIdx - 1) dotClass = "done";
      else if (!isError && i < stepIdx)  dotClass = "done";
      else if (!isError && i === stepIdx) dotClass = "active";
      else if (isError && i >= stepIdx) dotClass = "";

      const labelClass = (!isError && i === stepIdx) ? "active" : "";
      return `
        <div class="progress-step">
          <div class="progress-dot ${dotClass}">${step.icon}</div>
          <div class="progress-label ${labelClass}">${step.label}</div>
        </div>`;
    }).join("");

    const errorBanner = isError ? `
      <div style="background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);padding:12px 16px;margin:16px 0;">
        <div style="font-weight:600;color:#ef4444;margin-bottom:4px;">${HH.escapeHtml(order.status)}</div>
        ${order.seller_notes ? `<div style="font-size:14px;color:var(--text-secondary);">${HH.escapeHtml(order.seller_notes)}</div>` : ""}
      </div>` : "";

    const cashbackProof = order.status === "Cashback Sent" && order.cashback_proof_url ? `
      <div style="background:rgba(34,197,94,0.1);border:1px solid rgba(34,197,94,0.2);border-radius:var(--radius-md);padding:12px 16px;margin:16px 0;">
        <div style="font-weight:600;color:#22c55e;margin-bottom:8px;">💸 Cashback Sent!</div>
        <a href="${HH.escapeHtml(order.cashback_proof_url)}" target="_blank" class="btn-secondary btn-sm">
          View Proof
        </a>
      </div>` : "";

    const notesBanner = order.seller_notes && !isError ? `
      <div style="background:var(--bg-elevated);border:1px solid var(--border);border-radius:var(--radius-md);padding:12px 16px;margin:16px 0;font-size:14px;color:var(--text-secondary);">
        <strong>Note:</strong> ${HH.escapeHtml(order.seller_notes)}
      </div>` : "";

    return `
      <div class="card order-card">
        <div class="flex-between" style="margin-bottom:16px;">
          <div>
            <div style="font-size:13px;color:var(--text-muted);">Order</div>
            <div style="font-weight:600;font-size:15px;color:var(--text-primary);">${HH.escapeHtml(order.order_id)}</div>
          </div>
          ${HH.statusBadge(order.status)}
        </div>

        <div class="progress-bar-wrap">${progressSteps}</div>

        ${errorBanner}
        ${cashbackProof}
        ${notesBanner}

        <div>
          <div class="order-detail-row">
            <span class="order-detail-label">Product</span>
            <span class="order-detail-value">${HH.escapeHtml(order.product_title)}</span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Amazon Order ID</span>
            <span class="order-detail-value">${HH.escapeHtml(order.amazon_order_id)}</span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Cashback Amount</span>
            <span class="order-detail-value" style="color:var(--primary-light);font-weight:700;">
              ${HH.formatCashback(order.cashback_amount)}
            </span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Submitted</span>
            <span class="order-detail-value">${HH.timeAgo(order.submitted_at)}</span>
          </div>
          <div class="order-detail-row">
            <span class="order-detail-label">Last Updated</span>
            <span class="order-detail-value">${HH.timeAgo(order.updated_at)}</span>
          </div>
        </div>
      </div>`;
  }
</script>
</body>
</html>
