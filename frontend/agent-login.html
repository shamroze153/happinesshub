<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Agent Login — Happiness Hub</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { width: 100%; max-width: 420px; animation: slideUp 0.4s ease; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .logo-icon { width: 56px; height: 56px; font-size: 28px; border-radius: 14px; margin: 0 auto 12px; background: var(--primary); display: flex; align-items: center; justify-content: center; }
    .login-logo h1 { font-size: 1.5rem; margin-bottom: 4px; }
    .login-logo p { font-size: 14px; color: var(--text-muted); }
    .divider { display: flex; align-items: center; gap: 12px; margin: 20px 0; color: var(--text-muted); font-size: 13px; }
    .divider::before, .divider::after { content: ''; flex: 1; height: 1px; background: var(--border); }
  </style>
</head>
<body>

<div class="login-card card">
  <div class="login-logo">
    <div class="logo-icon">😊</div>
    <h1>Agent Login</h1>
    <p>Sign in to your agent dashboard</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="agentId">Agent ID</label>
      <input type="text" id="agentId" class="form-control" placeholder="e.g. agent01" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <div style="position:relative;">
        <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required style="padding-right:48px;">
        <button type="button" onclick="togglePw()" style="position:absolute;right:14px;top:50%;transform:translateY(-50%);background:none;border:none;cursor:pointer;color:var(--text-muted);font-size:18px;" aria-label="Toggle password visibility" id="pwToggle">👁️</button>
      </div>
    </div>

    <div id="loginError" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);padding:12px 14px;font-size:14px;color:#ef4444;margin-bottom:16px;"></div>

    <button type="submit" class="btn-primary w-full" id="loginBtn">Sign In</button>
  </form>

  <div class="divider">or</div>
  <div style="text-align:center;">
    <a href="index.html" style="font-size:14px;color:var(--text-secondary);">← Back to Deals</a>
  </div>
</div>

<script src="lib/hh.js"></script>
<script>
  // Redirect if already logged in
  if (HH.getSession("agent")) window.location.href = "agent-dashboard.html";

  let pwVisible = false;
  function togglePw() {
    pwVisible = !pwVisible;
    document.getElementById("password").type = pwVisible ? "text" : "password";
    document.getElementById("pwToggle").textContent = pwVisible ? "🙈" : "👁️";
  }

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const errBox = document.getElementById("loginError");
    errBox.style.display = "none";

    const agent_id = document.getElementById("agentId").value.trim();
    const password = document.getElementById("password").value;

    if (!agent_id || !password) { showErr("Please enter your Agent ID and password."); return; }

    btn.disabled = true;
    btn.textContent = "Signing in...";

    const res = await HH.post("agentLogin", { agent_id, password });
    btn.disabled = false;
    btn.textContent = "Sign In";

    if (res.success) {
      HH.setSession("agent", {
        token: res.token,
        actor_id: res.agent.agent_id,
        actor_type: "agent",
        name: res.agent.name,
        commission_rate: res.agent.commission_rate,
      });
      window.location.href = "agent-dashboard.html";
    } else {
      showErr(res.error || "Login failed. Check your credentials.");
    }
  });

  function showErr(msg) {
    const errBox = document.getElementById("loginError");
    errBox.textContent = msg;
    errBox.style.display = "block";
  }
</script>
</body>
</html>
