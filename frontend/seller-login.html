<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Seller Login — Happiness Hub</title>
  <link rel="stylesheet" href="styles/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { width: 100%; max-width: 420px; animation: slideUp 0.4s ease; }
    .login-logo { text-align: center; margin-bottom: 32px; }
    .login-logo .logo-icon { width: 56px; height: 56px; font-size: 28px; border-radius: 14px; margin: 0 auto 12px; background: var(--accent-green); display: flex; align-items: center; justify-content: center; }
  </style>
</head>
<body>
<div class="login-card card">
  <div class="login-logo">
    <div class="logo-icon">🏪</div>
    <h1>Seller Login</h1>
    <p>Manage your orders and cashback</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="sellerId">Seller ID</label>
      <input type="text" id="sellerId" class="form-control" placeholder="Your seller ID" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter your password" autocomplete="current-password" required>
    </div>
    <div id="loginError" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);padding:12px 14px;font-size:14px;color:#ef4444;margin-bottom:16px;"></div>
    <button type="submit" class="btn-primary w-full" id="loginBtn">Sign In</button>
  </form>

  <div style="text-align:center;margin-top:20px;">
    <a href="index.html" style="font-size:14px;color:var(--text-secondary);">← Back to Deals</a>
  </div>
</div>

<script src="lib/hh.js"></script>
<script>
  if (HH.getSession("seller")) window.location.href = "seller-dashboard.html";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const errBox = document.getElementById("loginError");
    errBox.style.display = "none";

    const seller_id = document.getElementById("sellerId").value.trim();
    const password = document.getElementById("password").value;
    if (!seller_id || !password) { showErr("Enter your Seller ID and password."); return; }

    btn.disabled = true;
    btn.textContent = "Signing in...";
    const res = await HH.post("sellerLogin", { seller_id, password });
    btn.disabled = false;
    btn.textContent = "Sign In";

    if (res.success) {
      HH.setSession("seller", {
        token: res.token,
        actor_id: res.seller.seller_id,
        actor_type: "seller",
        name: res.seller.name,
        store_name: res.seller.store_name,
      });
      window.location.href = "seller-dashboard.html";
    } else {
      showErr(res.error || "Login failed.");
    }
  });

  function showErr(msg) {
    const e = document.getElementById("loginError");
    e.textContent = msg;
    e.style.display = "block";
  }
</script>
</body>
</html>
