<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Login — Happiness Hub</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; background: var(--bg); }
    .login-card { width: 100%; max-width: 400px; animation: slideUp 0.4s ease; }
    .logo-wrap { text-align: center; margin-bottom: 32px; }
    .logo-icon-admin { width: 60px; height: 60px; border-radius: 16px; background: linear-gradient(135deg, var(--primary-dark), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-size: 28px; margin: 0 auto 12px; }
  </style>
</head>
<body>
<div class="login-card card">
  <div class="logo-wrap">
    <div class="logo-icon-admin">⚙️</div>
    <h2>Admin Access</h2>
    <p style="font-size:14px;color:var(--text-muted);margin-top:4px;">Happiness Hub Control Panel</p>
  </div>

  <form id="loginForm" novalidate>
    <div class="form-group">
      <label class="form-label" for="adminId">Admin ID</label>
      <input type="text" id="adminId" class="form-control" value="admin" autocomplete="username" required>
    </div>
    <div class="form-group">
      <label class="form-label" for="password">Password</label>
      <input type="password" id="password" class="form-control" placeholder="Enter admin password" autocomplete="current-password" required>
    </div>
    <div id="loginError" style="display:none;background:rgba(239,68,68,0.1);border:1px solid rgba(239,68,68,0.2);border-radius:var(--radius-md);padding:12px 14px;font-size:14px;color:#ef4444;margin-bottom:16px;"></div>
    <button type="submit" class="btn-primary w-full" id="loginBtn">Access Dashboard</button>
  </form>
  <div style="text-align:center;margin-top:16px;"><a href="../index.html" style="font-size:13px;color:var(--text-muted);">← Back to Site</a></div>
</div>

<script src="../lib/hh.js"></script>
<script>
  if (HH.getSession("admin")) window.location.href = "index.html";

  document.getElementById("loginForm").addEventListener("submit", async (e) => {
    e.preventDefault();
    const btn = document.getElementById("loginBtn");
    const errBox = document.getElementById("loginError");
    errBox.style.display = "none";

    const admin_id = document.getElementById("adminId").value.trim();
    const password = document.getElementById("password").value;
    if (!admin_id || !password) { showErr("Enter your credentials."); return; }

    btn.disabled = true; btn.textContent = "Authenticating...";
    const res = await HH.post("adminLogin", { admin_id, password });
    btn.disabled = false; btn.textContent = "Access Dashboard";

    if (res.success) {
      HH.setSession("admin", { token: res.token, actor_id: admin_id, actor_type: "admin" });
      window.location.href = "index.html";
    } else {
      showErr(res.error || "Invalid credentials.");
    }
  });

  function showErr(m) { const e = document.getElementById("loginError"); e.textContent = m; e.style.display = "block"; }
</script>
</body>
</html>
