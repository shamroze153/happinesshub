<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin — Happiness Hub</title>
  <link rel="stylesheet" href="../styles/main.css">
  <style>
    body { display: flex; align-items: center; justify-content: center; min-height: 100vh; padding: 20px; }
    .login-card { width: 100%; max-width: 360px; text-align: center; animation: slideUp 0.4s ease; }
    .logo-icon-admin { width: 72px; height: 72px; border-radius: 20px; background: linear-gradient(135deg, var(--primary-dark), var(--primary-light)); display: flex; align-items: center; justify-content: center; font-size: 34px; margin: 0 auto 20px; }
  </style>
</head>
<body>
<div class="login-card card">
  <div class="logo-icon-admin">⚙️</div>
  <h2 style="margin-bottom:8px;">Happiness Hub</h2>
  <p style="margin-bottom:28px;font-size:14px;">Admin Dashboard</p>
  <button onclick="enterDashboard()" class="btn-primary w-full" style="font-size:16px;padding:16px;" id="enterBtn">
    Enter Dashboard →
  </button>
  <div style="margin-top:16px;">
    <a href="../index.html" style="font-size:13px;color:var(--text-muted);">← Back to Site</a>
  </div>
</div>

<script src="../lib/hh.js"></script>
<script>
  // If already logged in go straight to dashboard
  if (HH.getSession("admin")) window.location.href = "index.html";

  function enterDashboard() {
    const btn = document.getElementById("enterBtn");
    btn.textContent = "Loading...";
    btn.disabled = true;
    // Set session directly — no API call needed
    HH.setSession("admin", {
      token: "admin_direct",
      actor_id: "admin",
      actor_type: "admin"
    });
    window.location.href = "index.html";
  }
</script>
</body>
</html>
